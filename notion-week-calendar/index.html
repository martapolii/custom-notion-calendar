<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tasks · Week view</title>
<style>
:root{--ink:#2c2c2b;--muted:#7d7a75;--line:#e6e5e3;--canvas:#fff;--surface:#f9f8f7;--blue:#2783de;--blue-soft:#e5f2fc;--green:#38845d;--red:#c84f46;--todo-card:#f4f1ef;--done-card:#e8f2ed}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}button,input{font:inherit}.app{max-width:1180px;margin:0 auto;padding:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.title-wrap{display:flex;align-items:center;gap:12px}.calendar-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:20px}h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.02em}.subtitle{margin:3px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}.btn{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 14px;background:#fff;color:var(--ink);cursor:pointer;font-weight:650}.btn:hover{background:var(--surface)}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn:focus-visible,.check:focus-visible,.key-input:focus-visible{outline:3px solid rgba(39,131,222,.25);outline-offset:2px}.week-shell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.day{min-width:0;border-right:1px solid var(--line)}.day:last-child{border-right:0}.day-head{height:72px;padding:11px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.day-name{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:750}.day-number{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-weight:750}.day.today .day-number{background:var(--blue);color:#fff}.day.today .day-head{background:linear-gradient(180deg,var(--blue-soft),#fff)}.day-body{min-height:470px;padding:8px;display:flex;flex-direction:column;gap:8px}.task{border:1px solid rgba(44,44,43,.06);border-radius:9px;padding:10px;transition:background .18s ease,border-color .18s ease,transform .18s ease}.task:hover{transform:translateY(-1px);border-color:rgba(44,44,43,.14)}.task.todo{background:var(--todo-card)}.task.done{background:var(--done-card)}.task.updating{opacity:.62}.task-title{font-weight:650;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.status-row{display:flex;align-items:center;gap:7px;margin-top:9px;min-height:28px}.check{appearance:none;width:22px;height:22px;min-width:22px;border:1.5px solid #c8c5c1;background:#fff;border-radius:5px;display:grid;place-items:center;cursor:pointer;margin:0}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:750;letter-spacing:.035em}.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.todo .pill{background:#f3d4d0;color:var(--red)}.done .pill{background:#cfe3d8;color:var(--green)}.empty,.loading{margin:auto;color:#aaa6a0;font-size:13px;text-align:center;padding:16px 4px}.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}.legend-item{display:flex;align-items:center;gap:6px}.swatch{width:10px;height:10px;border-radius:3px}.swatch.todo{background:var(--todo-card);border:1px solid #ded8d4}.swatch.done{background:var(--done-card);border:1px solid #cfe3d8}.sync{margin-left:auto}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:12px 14px;border:1px solid #efc1bd;border-radius:8px;background:#fff4f3;color:#8b332d;box-shadow:0 4px 18px rgba(0,0,0,.09);display:none}.lock{position:fixed;inset:0;background:rgba(255,255,255,.93);display:grid;place-items:center;padding:20px;z-index:5}.lock-card{width:min(390px,100%);border:1px solid var(--line);border-radius:12px;background:#fff;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}.lock-card h2{margin:0 0 6px;font-size:21px}.lock-card p{margin:0 0 16px;color:var(--muted);font-size:14px}.key-row{display:flex;gap:8px}.key-input{min-width:0;flex:1;height:44px;border:1px solid #c8c5c1;border-radius:8px;padding:0 12px}.error-text{min-height:20px;margin-top:10px!important;color:#a23d35!important}.hidden{display:none!important}
@media(max-width:900px){.week-shell{overflow-x:auto}.week-grid{min-width:980px}.app{padding:16px}.sync{width:100%;margin-left:0}}@media(max-width:560px){.toolbar{align-items:flex-start}.subtitle{display:none}.btn.today{display:none}.calendar-icon{width:36px;height:36px}h1{font-size:20px}.app{padding:12px}.day-body{min-height:420px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="lock" id="lock"><form class="lock-card" id="unlock-form"><h2>Open your calendar</h2><p>Enter the private access key configured for this calendar.</p><div class="key-row"><input class="key-input" id="key" type="password" autocomplete="current-password" placeholder="Access key" aria-label="Calendar access key" required><button class="btn primary" type="submit">Open</button></div><p class="error-text" id="key-error" role="alert"></p></form></div>
<main class="app">
<header class="toolbar"><div class="title-wrap"><div class="calendar-icon" aria-hidden="true">✓</div><div><h1>Tasks · Week view</h1><p class="subtitle" id="range"></p></div></div><div class="actions"><button class="btn" id="prev" aria-label="Previous week">←</button><button class="btn today" id="today">Today</button><button class="btn" id="next" aria-label="Next week">→</button></div></header>
<section class="week-shell" aria-label="Weekly task calendar"><div class="week-grid" id="calendar"></div></section>
<div class="legend"><span class="legend-item"><span class="swatch todo"></span>Incomplete</span><span class="legend-item"><span class="swatch done"></span>Complete</span><span class="sync" id="sync">Ready</span></div>
</main><div class="toast" id="toast" role="alert"></div>
<script>
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let monday=startOfWeek(new Date());let tasks=[];let key=sessionStorage.getItem('calendar-key')||'';
const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function formatRange(){const end=plusDays(monday,6);const opts={month:'long',day:'numeric'};const left=monday.toLocaleDateString(undefined,opts);const right=end.toLocaleDateString(undefined,{...opts,year:'numeric'});$('#range').textContent=`${left}–${right}`}
function renderLoading(){formatRange();$('#calendar').innerHTML=days.map((d,i)=>dayMarkup(d,plusDays(monday,i),'<div class="loading">Loading…</div>')).join('')}
function dayMarkup(name,date,body){return `<section class="day ${sameDate(date,new Date())?'today':''}"><header class="day-head"><span class="day-name">${name}</span><span class="day-number">${date.getDate()}</span></header><div class="day-body">${body}</div></section>`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){formatRange();$('#calendar').innerHTML=days.map((name,i)=>{const date=plusDays(monday,i),dateKey=iso(date),items=tasks.filter(t=>t.date.slice(0,10)===dateKey);const body=items.length?items.map(task=>`<article class="task ${task.done?'done':'todo'}" data-id="${task.id}"><div class="task-title">${escapeHtml(task.title)}</div><div class="status-row"><input class="check" type="checkbox" ${task.done?'checked':''} aria-label="Mark ${escapeHtml(task.title)} complete"><span class="pill">${task.done?'DONE':'TO DO'}</span></div></article>`).join(''):'<div class="empty">No tasks</div>';return dayMarkup(name,date,body)}).join('');document.querySelectorAll('.check').forEach(box=>box.addEventListener('change',toggleTask))}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Calendar-Key':key,...(options.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Request failed.');return b}
async function loadTasks(){renderLoading();$('#sync').textContent='Syncing…';try{const end=plusDays(monday,7);const data=await api(`/api/tasks?start=${iso(monday)}&end=${iso(end)}`);tasks=data.tasks;render();$('#sync').textContent='Synced with Notion'}catch(e){if(e.message.includes('Incorrect'))lock(e.message);else showError(e.message);$('#sync').textContent='Sync failed'}}
async function toggleTask(e){const card=e.target.closest('.task'),task=tasks.find(t=>t.id===card.dataset.id),next=e.target.checked,previous=task.done;task.done=next;render();const fresh=document.querySelector(`[data-id="${task.id}"]`);fresh?.classList.add('updating');try{await api('/api/task',{method:'PATCH',body:JSON.stringify({id:task.id,done:next})});$('#sync').textContent='Saved to Notion'}catch(err){task.done=previous;render();showError(err.message)}}
function showError(message){const t=$('#toast');t.textContent=message;t.style.display='block';setTimeout(()=>t.style.display='none',5000)}
function lock(message=''){sessionStorage.removeItem('calendar-key');key='';$('#lock').classList.remove('hidden');$('#key-error').textContent=message}
$('#unlock-form').addEventListener('submit',async e=>{e.preventDefault();key=$('#key').value;sessionStorage.setItem('calendar-key',key);$('#key-error').textContent='';$('#lock').classList.add('hidden');await loadTasks()});
$('#prev').onclick=()=>{monday=plusDays(monday,-7);loadTasks()};$('#next').onclick=()=>{monday=plusDays(monday,7);loadTasks()};$('#today').onclick=()=>{monday=startOfWeek(new Date());loadTasks()};
if(key){$('#lock').classList.add('hidden');loadTasks()}else renderLoading();
</script>
</body></html>
